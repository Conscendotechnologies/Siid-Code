<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-64cca173-5f0f-4540-b919-674fa0c9a8fd/styles.css">
<script src="_ds/nocturne-64cca173-5f0f-4540-b919-674fa0c9a8fd/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; background: #07080d; }
  @keyframes sdSpin { to { transform: rotate(360deg); } }
  @keyframes sdSpinRev { to { transform: rotate(-360deg); } }
  @keyframes sdDash { to { stroke-dashoffset: -1200; } }
  @keyframes sdDashRev { to { stroke-dashoffset: 1200; } }
  @keyframes sdBreathe { 0%, 100% { opacity: 0.42; transform: scale(1); } 50% { opacity: 0.86; transform: scale(1.07); } }
  @keyframes sdBreatheB { 0%, 100% { opacity: 0.30; transform: scale(1.05); } 50% { opacity: 0.70; transform: scale(0.97); } }
  @keyframes sdNode { 0%, 100% { opacity: 0.35; r: 2.6; } 50% { opacity: 1; r: 4.2; } }
  @keyframes sdFlick { 0%, 100% { opacity: 0.18; } 50% { opacity: 0.55; } }
  @keyframes sdDots { 0%, 100% { opacity: 0.26; } 50% { opacity: 0.14; } }
  @keyframes sdTextIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes sdCaret { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
</style>
</helmet>

<div style="--sd-energy:{{ energy }};--sd-energy2:{{ energy2 }};--sd-energy3:{{ energy3 }};min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(16px,4vh,48px) 24px;box-sizing:border-box;overflow:hidden;background:radial-gradient(70% 55% at 50% 44%, #12131f 0%, #07080d 72%);font-family:var(--font-body);">

  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(233,233,237,0.085) 1px, transparent 1px);background-size:4px 4px;animation:sdDots 7s ease-in-out infinite;pointer-events:none;"></div>

  <div style="position:relative;width:min(560px,88vw,66vh);aspect-ratio:1;display:grid;place-items:center;">

    <div style="position:absolute;width:74%;height:74%;border-radius:50%;filter:blur(64px);background:radial-gradient(circle,rgba(145,132,217,0.42),rgba(145,132,217,0) 70%);animation:sdBreathe 6.5s ease-in-out infinite;"></div>
    <div style="position:absolute;width:52%;height:52%;border-radius:50%;filter:blur(48px);background:radial-gradient(circle,rgba(255,122,0,0.24),rgba(255,122,0,0) 72%);animation:sdBreatheB 8s ease-in-out infinite;"></div>

    <svg viewBox="0 0 400 400" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:{{ fieldOp }};transform:scale({{ fieldScale }});transition:opacity 0.9s ease, transform 1.1s cubic-bezier(0.22,0.61,0.36,1);">
      <defs>
        <filter id="sdBloom" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5" result="b"></feGaussianBlur>
          <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode></feMerge>
        </filter>
        <filter id="sdSoft" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2"></feGaussianBlur>
        </filter>
        <linearGradient id="sdTrail" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FF7A00" stop-opacity="0"></stop>
          <stop offset="45%" stop-color="#b9b0e8"></stop>
          <stop offset="100%" stop-color="#9184d9" stop-opacity="0.15"></stop>
        </linearGradient>
        <linearGradient id="sdTrail2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9184d9" stop-opacity="0"></stop>
          <stop offset="50%" stop-color="#FF9A3C"></stop>
          <stop offset="100%" stop-color="#FF7A00" stop-opacity="0.1"></stop>
        </linearGradient>
      </defs>

      <g style="transform-origin:200px 200px;animation:sdSpin 54s linear infinite;">
        <path d="M357.1,265.1 L265.1,357.1 L134.9,357.1 L42.9,265.1 L42.9,134.9 L134.9,42.9 L265.1,42.9 L357.1,134.9 Z" fill="rgba(145,132,217,0.035)" stroke="rgba(145,132,217,0.38)" stroke-width="1"></path>
        <g stroke="rgba(145,132,217,0.16)" stroke-width="0.7">
          <line x1="357.1" y1="265.1" x2="134.9" y2="357.1"></line>
          <line x1="42.9" y1="134.9" x2="265.1" y2="42.9"></line>
          <line x1="42.9" y1="265.1" x2="265.1" y2="357.1"></line>
          <line x1="357.1" y1="134.9" x2="134.9" y2="42.9"></line>
        </g>
        <g fill="#b9b0e8">
          <circle cx="357.1" cy="265.1" r="3" style="animation:sdNode 3.2s ease-in-out infinite;"></circle>
          <circle cx="265.1" cy="357.1" r="3" style="animation:sdNode 3.2s ease-in-out infinite 0.4s;"></circle>
          <circle cx="134.9" cy="357.1" r="3" style="animation:sdNode 3.2s ease-in-out infinite 0.8s;"></circle>
          <circle cx="42.9" cy="265.1" r="3" style="animation:sdNode 3.2s ease-in-out infinite 1.2s;"></circle>
          <circle cx="42.9" cy="134.9" r="3" style="animation:sdNode 3.2s ease-in-out infinite 1.6s;"></circle>
          <circle cx="134.9" cy="42.9" r="3" style="animation:sdNode 3.2s ease-in-out infinite 2s;"></circle>
          <circle cx="265.1" cy="42.9" r="3" fill="#FF9A3C" style="animation:sdNode 3.2s ease-in-out infinite 2.4s;"></circle>
          <circle cx="357.1" cy="134.9" r="3" style="animation:sdNode 3.2s ease-in-out infinite 2.8s;"></circle>
        </g>
      </g>

      <g style="transform-origin:200px 200px;animation:sdSpinRev 34s linear infinite;">
        <path d="M328,200 L264,310.9 L136,310.9 L72,200 L136,89.1 L264,89.1 Z" fill="none" stroke="rgba(255,122,0,0.30)" stroke-width="0.9" stroke-dasharray="3 9" style="animation:sdFlick 4.5s ease-in-out infinite;"></path>
        <path d="M328,200 L264,310.9 L136,310.9 L72,200 L136,89.1 L264,89.1 Z" fill="rgba(255,255,255,0.012)" stroke="rgba(233,233,237,0.10)" stroke-width="0.6"></path>
      </g>

      <g style="transform-origin:200px 200px;animation:sdSpin var(--sd-energy) linear infinite;">
        <circle cx="200" cy="200" r="112" fill="none" stroke="url(#sdTrail)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="150 554" filter="url(#sdBloom)" opacity="0.9"></circle>
        <circle cx="200" cy="200" r="112" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="60 644" stroke-dashoffset="-30" opacity="0.75"></circle>
      </g>

      <g style="transform-origin:200px 200px;animation:sdSpinRev var(--sd-energy2) linear infinite;">
        <circle cx="200" cy="200" r="100" fill="none" stroke="url(#sdTrail2)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="90 538" filter="url(#sdBloom)" opacity="0.85"></circle>
      </g>

      <g style="transform-origin:200px 200px;animation:sdSpin var(--sd-energy3) linear infinite;" filter="url(#sdSoft)">
        <circle cx="200" cy="200" r="140" fill="none" stroke="rgba(185,176,232,0.55)" stroke-width="1.2" stroke-dasharray="4 26" stroke-linecap="round"></circle>
      </g>

      <g style="transform-origin:200px 200px;animation:sdSpinRev 26s linear infinite;" fill="#b9b0e8" filter="url(#sdSoft)">
        <circle cx="200" cy="44" r="1.8" opacity="0.9"></circle>
        <circle cx="330" cy="150" r="1.4" opacity="0.7"></circle>
        <circle cx="300" cy="320" r="1.6" opacity="0.8"></circle>
        <circle cx="86" cy="286" r="1.3" opacity="0.6"></circle>
        <circle cx="70" cy="120" r="1.7" opacity="0.75"></circle>
      </g>
      <g style="transform-origin:200px 200px;animation:sdSpin 17s linear infinite;" fill="#FFB066" filter="url(#sdSoft)">
        <circle cx="200" cy="72" r="1.5" opacity="0.85"></circle>
        <circle cx="318" cy="252" r="1.2" opacity="0.6"></circle>
        <circle cx="96" cy="230" r="1.4" opacity="0.7"></circle>
      </g>

      <sc-if value="{{ validating }}" hint-placeholder-val="{{ false }}">
        <g style="transform-origin:200px 200px;animation:sdSpin 2.6s linear infinite;">
          <path d="M357.1,265.1 L265.1,357.1 L134.9,357.1 L42.9,265.1 L42.9,134.9 L134.9,42.9 L265.1,42.9 L357.1,134.9 Z" fill="none" stroke="#e9e9ed" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="120 900" filter="url(#sdBloom)"></path>
        </g>
      </sc-if>

      <circle cx="200" cy="200" r="82" fill="#07080d" opacity="0.72"></circle>
      <circle cx="200" cy="200" r="82" fill="none" stroke="rgba(145,132,217,0.18)" stroke-width="0.8"></circle>
    </svg>

    <img src="siid-logo.png" alt="SIID" style="position:relative;width:29%;height:29%;object-fit:contain;filter:drop-shadow(0 0 26px rgba(145,132,217,0.35));" />
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:13px;margin-top:clamp(6px,2.5vh,26px);">
    <div style="display:flex;align-items:center;gap:9px;height:22px;">
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
        <i class="ph ph-check-circle" style="font-size:16px;color:oklch(0.78 0.13 150);"></i>
      </sc-if>
      <span key="{{ phaseKey }}" style="font-size:clamp(13px,1.6vw,15px);letter-spacing:0.01em;color:var(--color-neutral-100);animation:sdTextIn 0.45s ease-out;">{{ phaseLabel }}</span>
      <sc-if value="{{ working }}" hint-placeholder-val="{{ true }}">
        <span style="font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--color-accent-300);animation:sdCaret 1.1s steps(1,end) infinite;">…</span>
      </sc-if>
    </div>

    <div style="display:flex;align-items:center;gap:6px;">
      <sc-for list="{{ pips }}" as="p" hint-placeholder-count="6">
        <span style="width:{{ p.w }};height:2px;border-radius:2px;background:{{ p.bg }};transition:background 0.4s ease, width 0.4s ease;"></span>
      </sc-for>
    </div>

    <span style="font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;color:var(--color-neutral-400);">{{ caption }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:620},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SIID · Developer Orchestrator&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
const PHASES = [
  { label: 'Understanding your org', e: 1.00 },
  { label: 'Retrieving metadata', e: 1.25 },
  { label: 'Planning solution', e: 1.45 },
  { label: 'Generating implementation', e: 1.75 },
  { label: 'Validating changes', e: 0.75, validating: true },
  { label: 'Ready', e: 0.5, ready: true }
];

class Component extends DCLogic {
  state = { i: 0 };

  componentDidMount() { this.schedule(); }
  componentWillUnmount() { clearTimeout(this._t); }

  schedule() {
    const p = PHASES[this.state.i];
    this._t = setTimeout(() => {
      this.setState(s => ({ i: (s.i + 1) % PHASES.length }), () => this.schedule());
    }, p.ready ? 1800 : 2900);
  }

  renderVals() {
    const speed = Number(this.props.speed) || 1;
    const i = this.state.i;
    const p = PHASES[i];
    const k = p.e * speed;
    return {
      energy: (7 / k).toFixed(2) + 's',
      energy2: (9.5 / k).toFixed(2) + 's',
      energy3: (22 / k).toFixed(2) + 's',
      phaseLabel: this.props.label || p.label,
      phaseKey: 'p' + i,
      working: !p.ready,
      validating: !!p.validating,
      ready: !!p.ready,
      fieldOp: p.ready ? 0.22 : 1,
      fieldScale: p.ready ? 0.82 : 1,
      pips: PHASES.map((x, j) => ({
        w: j === i ? '22px' : '10px',
        bg: j === i ? 'var(--color-accent)' : j < i ? 'var(--color-accent-700)' : 'var(--color-neutral-800)'
      })),
      caption: this.props.caption || 'SIID · Developer Orchestrator'
    };
  }
}
</script>
</body>
</html>
